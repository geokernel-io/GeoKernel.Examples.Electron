<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>TerrainLoading — GeoKernel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <h1>Sagrada Família — DEM</h1>
    <label for="quality">Terrain mesh</label>
    <select id="quality"><option value="256">256 — Fast</option><option value="512" selected>512 — Balanced</option><option value="1024">1024 — Detailed</option></select>
    <button id="reload">Reload terrain</button>
    <button id="cancel" disabled>Cancel loading</button>
    <label for="ramp">Color scale</label>
    <select id="ramp"><option value="1">Terrain</option><option value="2">Grayscale</option><option value="3">Viridis</option><option value="4">Inferno</option><option value="5">Ocean</option></select>
    <label for="height">Vertical exaggeration</label>
    <input id="height" type="number" min="0.25" max="10" step="0.25" value="1">
    <p>Colors represent relative terrain relief. DEM heights are treated as metres; the vertical datum is unverified.</p>
    <p>Left drag: pan<br>Wheel / right drag: zoom<br>Middle / Ctrl + left drag: orbit</p>
    <button id="reset">Reset view</button>
    <progress id="progress"></progress>
    <p id="status" role="status">Preparing terrain…</p>
  </aside>
  <script src="renderer.js"></script>
</body>
</html>
