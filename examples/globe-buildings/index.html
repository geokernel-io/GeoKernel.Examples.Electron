<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlobeBuildings — GeoKernel</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <header>
    <label><input id="extrude" type="checkbox" disabled> Extrude</label>
    <label title="Display height, not measured. Turn extrusion off to change it.">Display height (m):
      <input id="displayHeight" type="number" min="1" max="300" step="1" value="18" disabled>
    </label>
    <button id="zoom" disabled>Zoom to buildings</button>
    <label><input id="atmosphere" type="checkbox" checked disabled> Atmosphere</label>
    <label><input id="esri" type="checkbox" checked disabled> Esri</label>
  </header>
  <main aria-label="Globe"></main>
  <footer id="status" role="status">Starting Globe…</footer>
</body>
</html>
